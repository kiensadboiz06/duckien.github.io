
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Love Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Nút nhạc */
    #musicBtn {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff66ff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1000;
      text-shadow: 0 0 6px #fff, 0 0 12px #ff33cc;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 8px #ff99ff, 0 0 20px #ff33cc; }
      100% { box-shadow: 0 0 20px #ff33cc, 0 0 40px #ff66ff; }
    }

    /* Sao li ti */
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.2; }
      to   { opacity: 1; }
    }

    /* Chữ rơi */
    .falling {
      position: absolute;
      top: -100px;
      font-size: 80px;
      font-weight: bold;
      white-space: nowrap;
      user-select: none;
      color: #fff;
      animation: fall linear forwards, flicker 1.5s infinite alternate, colorPulse 2s infinite alternate;
      text-shadow: 0 0 8px #ff66ff, 0 0 16px #ff33cc, 0 0 24px #ff0099, 0 0 40px #ff66ff;
    }

    @keyframes colorPulse {
      0%   { color: #fff; text-shadow: 0 0 8px #fff, 0 0 16px #ffccff, 0 0 24px #fff; }
      100% { color: #ff99ff; text-shadow: 0 0 10px #ff33cc, 0 0 20px #ff00aa, 0 0 30px #ff66ff; }
    }

    @keyframes flicker {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 1;
      }
    }

    /* Tim */
    .heart {
      position: absolute;
      top: -50px;
      color: #ff1a1a;
      text-shadow: 0 0 6px #ff3333, 0 0 12px #ff0000, 0 0 20px #ff3333;
      animation: fall linear forwards, flicker 2s infinite alternate;
    }

    /* Ảnh gấu */
    .bear {
      position: absolute;
      top: -100px;
      animation: fall linear forwards;
      user-select: none;
    }
  </style>
</head>
<body>
    <!-- Nút phát nhạc -->
    <button id="musicBtn">🎵 Click vào đây để nghe nhạc nha 🎵</button>

    <!-- Nhạc -->
    <audio id="sound" loop>
      <source src="style/tiktok.mp3" type="audio/mpeg" />
    </audio>

<script>
  // tạo sao nền
  function createStars() {
    for (let i = 0; i < 200; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.top = Math.random() * window.innerHeight + "px";
      star.style.animationDuration = (1 + Math.random() * 3) + "s";
      document.body.appendChild(star);
    }
  }

  // danh sách câu chữ rơi
  const messages = [
    "I love you",
    "I love you so much",
    "Chụt yêu",
    "Yêu em nhất thế giới"
  ];

  // tạo chữ/tim/ảnh gấu rơi
  function createFallingItem() {
    const el = document.createElement("div");
    let rand = Math.random();

    if (rand < 0.6) {
      el.classList.add("falling");
      el.innerText = messages[Math.floor(Math.random() * messages.length)];
    } else if (rand < 0.9) {
      const img = document.createElement("img");
      img.src = "style/gau" + (1 + Math.floor(Math.random() * 4)) + ".jpeg"; 
      img.style.width = "150px";
      img.style.height = "150px";
      el.classList.add("bear");
      el.appendChild(img);
    } else {
      el.classList.add("heart");
      el.innerText = "💗";
      el.innerText = "🩵";
      el.style.fontSize = (30 + Math.random() * 60) + "px";
    }

    el.style.left = Math.random() * window.innerWidth + "px";
    el.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(el);

    el.addEventListener("animationend", () => {
      el.remove();
    });
  }

  createStars();
  setInterval(createFallingItem, 200);

  // điều khiển nhạc
  const audio = document.getElementById("sound");
  const btn = document.getElementById("musicBtn");

  btn.addEventListener("click", () => {
    audio.play();
    btn.style.display = "none"; // ẩn nút sau khi bấm
  });
</script>
</body>
</html>
